[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/loveretro/tg5040-toolchain:main"
pre-build = ["apt-get update && apt-get install -y --no-install-recommends clang libclang-dev"]

[target.aarch64-unknown-linux-gnu.env]
passthrough = [
    "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=/opt/aarch64-nextui-linux-gnu/aarch64-nextui-linux-gnu/libc",
]
