[package]
name = "khana"
version = "0.12.1"
edition = "2024"

[features]
default = ["alsa-sequencer"]
alsa-sequencer = ["dep:midir"]
ableton-link = ["dep:rusty_link"]

[dependencies]
midir = { version = "0.11.0", optional = true }
sdl2 = "0.38.0"
rusty_link = { version = "0.4.9", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
